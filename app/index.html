<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Demo Login</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        
        .login-container {
            background: white;
            padding: 40px;
            border-radius: 8px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.2);
            width: 100%;
            max-width: 400px;
        }
        
        h1 {
            text-align: center;
            color: #333;
            margin-bottom: 30px;
            font-size: 28px;
        }
        
        .form-group {
            margin-bottom: 20px;
        }
        
        label {
            display: block;
            margin-bottom: 8px;
            color: #555;
            font-weight: 500;
        }
        
        input {
            width: 100%;
            padding: 12px;
            border: 1px solid #ddd;
            border-radius: 4px;
            font-size: 14px;
            transition: border-color 0.3s;
        }
        
        input:focus {
            outline: none;
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
        }
        
        input.error-highlight {
            border-color: #c33;
            background-color: #fee;
        }
        
        input.error-highlight:focus {
            box-shadow: 0 0 0 3px rgba(204, 51, 51, 0.1);
        }
        
        .email-error-message {
            color: #c33;
            font-size: 12px;
            margin-top: 5px;
            display: none;
        }
        
        .email-error-message.show {
            display: block;
        }
        
        .button-group {
            display: flex;
            gap: 10px;
            margin-top: 10px;
        }
        
        button {
            flex: 1;
            padding: 12px;
            border: none;
            border-radius: 4px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
        }
        
        .btn-login {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }
        
        .btn-login:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.4);
        }
        
        .btn-login:active {
            transform: translateY(0);
        }
        
        .btn-cancel {
            background-color: #f0f0f0;
            color: #333;
            border: 1px solid #ddd;
        }
        
        .btn-cancel:hover {
            background-color: #e0e0e0;
            transform: translateY(-2px);
        }
        
        .btn-cancel:active {
            transform: translateY(0);
        }
        
        .message {
            margin-top: 20px;
            padding: 12px;
            border-radius: 4px;
            text-align: center;
            font-weight: 500;
            display: none;
        }
        
        .error {
            background-color: #fee;
            color: #c33;
            border: 1px solid #fcc;
            display: block;
        }
        
        .success {
            background-color: #efe;
            color: #3c3;
            border: 1px solid #cfc;
            display: block;
        }
        
        .demo-info {
            margin-top: 30px;
            padding-top: 20px;
            border-top: 1px solid #eee;
            font-size: 13px;
            color: #999;
            text-align: center;
        }
        
        .demo-info strong {
            color: #666;
        }
        
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.5);
            z-index: 1000;
            justify-content: center;
            align-items: center;
        }
        
        .modal.active {
            display: flex;
        }
        
        .modal-content {
            background: white;
            padding: 30px;
            border-radius: 8px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.3);
            max-width: 400px;
            text-align: center;
        }
        
        .modal-icon {
            font-size: 48px;
            margin-bottom: 15px;
        }
        
        .modal-title {
            font-size: 20px;
            font-weight: 600;
            color: #c33;
            margin-bottom: 10px;
        }
        
        .modal-message {
            color: #666;
            font-size: 14px;
            margin-bottom: 25px;
            line-height: 1.6;
        }
        
        .modal-close {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            padding: 12px 30px;
            border-radius: 4px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
        }
        
        .modal-close:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.4);
        }
    </style>
</head>
<body>
    <div class="login-container">
        <h1>Login</h1>
        
        <form id="loginForm">
            <div class="form-group">
                <label for="email">Email</label>
                <input type="email" id="email" placeholder="Enter your email" required autocomplete="off">
                <div class="email-error-message" id="emailErrorMsg">Please enter a valid email address</div>
            </div>
            
            <div class="form-group">
                <label for="password">Password</label>
                <input type="password" id="password" placeholder="Enter your password" required>
            </div>
            
            <div class="button-group">
                <button type="submit" class="btn-login">Log in</button>
                <button type="button" class="btn-cancel" onclick="cancelLogin()">Cancel</button>
            </div>
        </form>
        
        <div id="message" class="message"></div>
        
        <div id="errorModal" class="modal">
            <div class="modal-content">
                <div class="modal-icon">⚠️</div>
                <div class="modal-title">Login Failed</div>
                <div class="modal-message" id="modalMessage"></div>
                <button class="modal-close" onclick="closeModal()">Try Again</button>
            </div>
        </div>
        
        <div class="demo-info">
            <p><strong>Demo Credentials:</strong></p>
            <p>Email: demo@example.com</p>
            <p>Password: password123</p>
        </div>
    </div>
    
    <script>
        const form = document.getElementById('loginForm');
        const emailInput = document.getElementById('email');
        const passwordInput = document.getElementById('password');
        const messageDiv = document.getElementById('message');
        const errorModal = document.getElementById('errorModal');
        const modalMessage = document.getElementById('modalMessage');
        const emailErrorMsg = document.getElementById('emailErrorMsg');
        
        let emailValidationTimeout;
        
        // Demo credentials
        const DEMO_EMAIL = 'demo@example.com';
        const DEMO_PASSWORD = 'password123';
        
        // Email validation regex
        function isValidEmail(email) {
            const emailRegex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
            return emailRegex.test(email);
        }
        
        // Real-time email validation with 1-second delay
        emailInput.addEventListener('input', function() {
            clearTimeout(emailValidationTimeout);
            emailInput.classList.remove('error-highlight');
            emailErrorMsg.classList.remove('show');
            
            if (emailInput.value.trim() === '') {
                return;
            }
            
            emailValidationTimeout = setTimeout(function() {
                const email = emailInput.value.trim();
                if (email && !isValidEmail(email)) {
                    emailInput.classList.add('error-highlight');
                    emailErrorMsg.classList.add('show');
                }
            }, 1000);
        });
        
        // Clear error on focus
        emailInput.addEventListener('focus', function() {
            clearTimeout(emailValidationTimeout);
            emailInput.classList.remove('error-highlight');
            emailErrorMsg.classList.remove('show');
        });
        
        form.addEventListener('submit', function(e) {
            e.preventDefault();
            messageDiv.className = 'message';
            
            const email = emailInput.value.trim();
            const password = passwordInput.value.trim();
            
            // Validation: check for empty fields
            if (!email || !password) {
                modalMessage.textContent = 'Please fill in all fields.';
                openModal();
                return;
            }
            
            // Authentication: check demo credentials
            if (email === DEMO_EMAIL && password === DEMO_PASSWORD) {
                // Success: store email and redirect
                sessionStorage.setItem('userEmail', email);
                window.location.href = 'success.html';
            } else {
                // Failed login: show popup
                modalMessage.textContent = 'Invalid email or password. Please try again.';
                openModal();
            }
        });
        
        function openModal() {
            errorModal.classList.add('active');
            emailInput.focus();
        }
        
        function closeModal() {
            errorModal.classList.remove('active');
            emailInput.focus();
        }
        
        function cancelLogin() {
            form.reset();
            closeModal();
        }
    </script>
</body>
</html>
