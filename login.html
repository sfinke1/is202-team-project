<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Comic Sans MS', 'Trebuchet MS', cursive;
            background-color: #0000ff;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            position: relative;
            overflow: hidden;
        }

        body::before {
            content: '';
            position: fixed;
            top: -100%;
            left: -100%;
            width: 300%;
            height: 300%;
            background-image: url('data:image/svg+xml,<svg xmlns="http://www.w3.org/2000/svg" width="20" height="20"><rect fill="%23ffff00" width="10" height="10"/><rect fill="%23ffff00" x="10" y="10" width="10" height="10"/></svg>');
            animation: spinBg 32s linear infinite;
            z-index: -1;
            transform-origin: 50% 50%;
        }

        @keyframes spinBg {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .container {
            background: #ffff99;
            border: 5px solid;
            border-color: #ffff00 #cccccc #cccccc #ffff00;
            box-shadow: inset 1px 1px 0 #ffffff, inset -1px -1px 0 #808080, 3px 3px 5px #000000;
            width: 100%;
            max-width: 450px;
            padding: 30px;
            text-align: center;
        }

        h1 {
            font-size: 36px;
            margin-bottom: 10px;
            color: #0000ff;
            text-shadow: 2px 2px 0 #ffff00;
            letter-spacing: 2px;
        }

        .header-decoration {
            margin-bottom: 20px;
            font-size: 24px;
        }

        .form-group {
            margin-bottom: 15px;
            text-align: left;
        }

        label {
            display: block;
            font-size: 14px;
            font-weight: bold;
            color: #0000ff;
            margin-bottom: 5px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        input {
            width: 100%;
            padding: 10px;
            border: 3px solid;
            border-color: #ffffff #808080 #808080 #ffffff;
            background: #ffffff;
            font-family: 'Courier New', monospace;
            font-size: 14px;
            color: #000000;
        }

        input:focus {
            outline: 2px solid #ff00ff;
            outline-offset: 2px;
        }

        button {
            width: 100%;
            padding: 12px;
            background: #ff9900;
            color: #000000;
            border: 3px solid;
            border-color: #ffff99 #404040 #404040 #ffff99;
            font-family: 'Comic Sans MS', cursive;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 15px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        button:active {
            border-color: #404040 #ffff99 #ffff99 #404040;
        }

        .message {
            margin-top: 15px;
            padding: 10px;
            border: 3px solid;
            font-size: 14px;
            text-align: center;
            display: none;
            font-weight: bold;
            font-family: 'Courier New', monospace;
        }

        .message.error {
            background: #ff6666;
            color: #ffffff;
            border-color: #ff0000;
        }

        .message.success {
            background: #00cc00;
            color: #ffffff;
            border-color: #009900;
        }

        .demo-hint {
            margin-top: 20px;
            padding: 12px;
            background: #ff99ff;
            border: 2px dashed #ff00ff;
            font-size: 12px;
            color: #000000;
            text-align: center;
            font-weight: bold;
        }

        .demo-hint strong {
            color: #0000ff;
            text-decoration: underline;
        }

        .blink {
            animation: blink 0.7s infinite;
        }

        @keyframes blink {
            0%, 49%, 100% { opacity: 1; }
            50%, 99% { opacity: 0.3; }
        }

        @keyframes spinBg {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.7);
            z-index: 1000;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .modal.show {
            display: flex;
        }

        .modal-content {
            background: #ffff99;
            border: 5px solid;
            border-color: #ffff00 #cccccc #cccccc #ffff00;
            box-shadow: inset 1px 1px 0 #ffffff, inset -1px -1px 0 #808080, 5px 5px 10px #000000;
            padding: 25px;
            max-width: 400px;
            width: 100%;
            text-align: center;
        }

        .modal-header {
            font-size: 28px;
            font-weight: bold;
            color: #0000ff;
            margin-bottom: 15px;
            text-shadow: 2px 2px 0 #ffff00;
        }

        .modal-decoration {
            font-size: 20px;
            margin: 10px 0;
            letter-spacing: 2px;
            color: #ff00ff;
            font-weight: bold;
        }

        .modal-message {
            font-size: 16px;
            color: #000000;
            font-family: 'Comic Sans MS', cursive;
            font-weight: bold;
            margin: 20px 0;
            line-height: 1.6;
        }

        .modal-close {
            background: #ff9900;
            color: #000000;
            border: 3px solid;
            border-color: #ffff99 #404040 #404040 #ffff99;
            padding: 12px 30px;
            font-family: 'Comic Sans MS', cursive;
            font-size: 14px;
            font-weight: bold;
            cursor: pointer;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-top: 15px;
        }

        .modal-close:active {
            border-color: #404040 #ffff99 #ffff99 #404040;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header-decoration">✧･ﾟ: *✧･ﾟ:* *:･ﾟ✧*:･ﾟ✧</div>
        <h1>★ LOGIN ★</h1>
        <div class="header-decoration blink">Welcome!</div>
        <form id="loginForm">
            <div class="form-group">
                <label for="email">Email</label>
                <input type="email" id="email" placeholder="Enter your email" required>
            </div>
            <div class="form-group">
                <label for="password">Password</label>
                <input type="password" id="password" placeholder="Enter your password" required>
            </div>
            <button type="submit">Log in</button>
            <div class="message" id="message"></div>
        </form>
        <div class="demo-hint">
            <strong>Demo credentials:</strong><br>
            demo@example.com / password123
        </div>
    </div>

    <div class="modal" id="successModal">
        <div class="modal-content">
            <div class="modal-decoration">⭐ ✨ ⭐ ✨ ⭐</div>
            <div class="modal-header">SUCCESS!</div>
            <div class="modal-decoration">✨ ⭐ ✨ ⭐ ✨</div>
            <div class="modal-message">
                You have been logged in successfully!<br><br>
                <span class="blink">Welcome back! 🌐</span>
            </div>
            <button class="modal-close" onclick="closeModal()">OK!</button>
        </div>
    </div>

    <script>
        const form = document.getElementById('loginForm');
        const emailInput = document.getElementById('email');
        const passwordInput = document.getElementById('password');
        const messageDiv = document.getElementById('message');
        const successModal = document.getElementById('successModal');

        // Demo credentials
        const demoEmail = 'demo@example.com';
        const demoPassword = 'password123';

        function closeModal() {
            successModal.classList.remove('show');
            emailInput.value = '';
            passwordInput.value = '';
        }

        form.addEventListener('submit', (e) => {
            e.preventDefault();

            const email = emailInput.value.trim();
            const password = passwordInput.value.trim();

            // Clear previous message
            messageDiv.className = 'message';

            // Check for empty fields
            if (!email || !password) {
                messageDiv.textContent = 'Please fill in all fields.';
                messageDiv.classList.add('error');
                return;
            }

            // Validate email format
            const emailRegex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
            if (!emailRegex.test(email)) {
                messageDiv.textContent = 'Please enter a valid email address.';
                messageDiv.classList.add('error');
                return;
            }

            // Check against demo credentials
            if (email === demoEmail && password === demoPassword) {
                successModal.classList.add('show');
            } else {
                messageDiv.textContent = '✗ Invalid email or password.';
                messageDiv.classList.add('error');
            }
        });
    </script>
</body>
</html>
